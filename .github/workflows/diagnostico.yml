name: Diagnóstico da API do Instagram

on:
  workflow_dispatch:
  push:
    branches: [reels-midia]
    paths: ['publicador/diagnostico.mjs', '.github/workflows/diagnostico.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node publicador/diagnostico.mjs
