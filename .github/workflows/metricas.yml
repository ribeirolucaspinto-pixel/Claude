name: Métricas do Instagram

on:
  schedule:
    - cron: '0 12 * * *'   # 9h em Brasília
    - cron: '0 0 * * *'    # 21h em Brasília (pega os stories antes de sumirem)
  workflow_dispatch:

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar métricas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node publicador/metricas.mjs
      - name: Gravar
        run: |
          git config user.name "publicador-instagram"
          git config user.email "publicador@users.noreply.github.com"
          git add -A gestao
          git diff --cached --quiet && exit 0
          git commit -m "Métricas do Instagram"
          for i in 1 2 3 4; do git pull --rebase -q origin reels-midia && git push -q origin HEAD:reels-midia && exit 0; sleep $((i*2)); done
          exit 1
