name: Publicar no Instagram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [reels-midia]
    paths: ['fila/**']

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importar posts com mídia em URL
        run: |
          ls fila/importar/*.json >/dev/null 2>&1 || exit 0
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          node publicador/importar.mjs
          git add -A fila
          git diff --cached --quiet && exit 0
          git config user.name "publicador-instagram"
          git config user.email "publicador@users.noreply.github.com"
          git commit -q -m "Publicador: importa mídia para a fila"
          for i in 1 2 3 4; do git pull --rebase -q origin reels-midia && git push -q origin HEAD:reels-midia && break; sleep $((i*2)); done
          echo "RAW_BASE=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publicar o que venceu
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node publicador/publicar.mjs
      - name: Gravar o resultado na fila
        if: always()
        run: |
          git config user.name "publicador-instagram"
          git config user.email "publicador@users.noreply.github.com"
          git add -A fila gestao
          git diff --cached --quiet && exit 0
          git commit -m "Publicador: atualiza fila e agenda"
          for i in 1 2 3 4; do git pull --rebase -q origin reels-midia && git push -q origin HEAD:reels-midia && exit 0; sleep $((i*2)); done
          exit 1
